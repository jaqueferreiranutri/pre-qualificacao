<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metodo VITA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Libre+Baskerville:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#EDE0D4;display:flex;align-items:center;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:414px;height:100vh;max-height:850px;background:#FAF8F5;display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:12px 16px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:.5px solid rgba(107,39,55,.1);flex-shrink:0}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #6B2737;flex-shrink:0;position:relative}
.av img,.mav img,.tav img{width:100%;height:100%;object-fit:cover;object-position:center top}
.dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:#2D6B52;border-radius:50%;border:2px solid #fff}
.hname{font-family:'Libre Baskerville',serif;font-style:italic;font-size:16px;color:#6B2737}
.hmet{font-size:9px;color:#2D6B52;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.hstat{font-size:11px;color:#2D6B52;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:#FAF8F5}
.chat::-webkit-scrollbar{width:0}
.row{display:flex;align-items:flex-end;gap:8px}
.row.j{flex-direction:row}.row.u{flex-direction:row-reverse}
.mav{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid #6B2737;flex-shrink:0}
.x{border:none!important;background:transparent!important}
.bl{max-width:76%;padding:9px 13px 5px;border-radius:16px;word-wrap:break-word}
.bl.j{background:#fff;border-bottom-left-radius:3px;border:.5px solid rgba(107,39,55,.08);box-shadow:0 1px 3px rgba(107,39,55,.06)}
.bl.u{background:#6B2737;border-bottom-right-radius:3px}
.bl p{font-size:14px;line-height:1.6;color:#1a1a18}
.bl.u p{color:#FAF8F5}
.tm{font-size:10px;opacity:.4;text-align:right;margin-top:3px}
.bl.u .tm{color:#FAF8F5}
.typ{display:none;align-items:flex-end;gap:8px;padding:0 14px}
.typ.on{display:flex}
.tav{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid #6B2737;flex-shrink:0}
.tbl{background:#fff;border:.5px solid rgba(107,39,55,.08);border-radius:16px;border-bottom-left-radius:3px;padding:11px 15px}
.dots{display:flex;gap:4px}
.dots span{width:7px;height:7px;background:#D6B88B;border-radius:50%;animation:blink 1.3s infinite}
.dots span:nth-child(2){animation-delay:.25s}.dots span:nth-child(3){animation-delay:.5s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
.opts{display:flex;flex-direction:column;gap:6px;padding-left:36px}
.opt{background:#fff;border:.5px solid rgba(107,39,55,.3);border-radius:20px;padding:9px 18px;font-size:13.5px;color:#6B2737;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:left;width:fit-content}
.opt:hover{background:#6B2737;color:#FAF8F5}
.btnfin{display:inline-flex;align-items:center;gap:8px;background:#2D6B52;color:#fff;border:none;border-radius:20px;padding:12px 22px;font-size:14px;font-weight:500;text-decoration:none;margin-left:36px;cursor:pointer}
.inp-area{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:.5px solid rgba(107,39,55,.08);flex-shrink:0}
.inp{flex:1;background:#F0EBE3;border:.5px solid rgba(107,39,55,.15);border-radius:22px;padding:10px 16px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:#1a1a18}
.inp:disabled{opacity:.4}.inp::placeholder{color:#9A8878}
.snd{width:42px;height:42px;background:#6B2737;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.snd svg{width:17px;height:17px;fill:#fff}
</style>
</head>

var stat=document.getElementById('stat');

function tm(){var n=new Date();return ('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)}

function bubble(txt,side){
  var row=document.createElement('div');row.className='row '+side;
  if(side==='j'){var a=document.createElement('div');a.className='mav';var i=document.createElement('img');i.src=SRC;a.appendChild(i);row.appendChild(a);}
  var b=document.createElement('div');b.className='bl '+side;
  b.innerHTML='<p>'+txt+'</p><div class="tm">'+tm()+'</div>';
  row.appendChild(b);
  if(side==='u'){var e=document.createElement('div');e.className='mav x';row.appendChild(e);}
  chat.appendChild(row);chat.scrollTop=99999;
}

function choices(list,cb){
  var wrap=document.createElement('div');wrap.className='opts';
  list.forEach(function(o){
    var btn=document.createElement('button');btn.className='opt';btn.textContent=o;
    btn.onclick=function(){wrap.remove();bubble(o,'u');setTimeout(function(){cb(o);},400);};
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);chat.scrollTop=99999;
}

function typing(ms,cb){
  typ.classList.add('on');stat.textContent='digitando...';chat.scrollTop=99999;
  setTimeout(function(){typ.classList.remove('on');stat.textContent='online';cb();},ms);
}

function say(txt,cb){typing(Math.min(1000+txt.length*18,3500),function(){bubble(txt,'j');setTimeout(cb,300);})}

function ask(ph,cb){inp.placeholder=ph;inp.disabled=false;inp.focus();inp._cb=cb;}

function send(){
  var v=inp.value.trim();if(!v||inp.disabled)return;
  var cb=inp._cb;inp.value='';inp.disabled=true;inp.placeholder='Mensagem...';inp._cb=null;
  bubble(v,'u');setTimeout(function(){cb(v);},400);
}

inp.addEventListener('keypress',function(e){if(e.key==='Enter')send();});

function done(){
  var msg='Ola! Acabei de preencher o formulario do Metodo VITA. Quero saber qual e o meu proximo passo.';
  var a=document.createElement('a');a.className='btnfin';
  a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  a.target='_blank';a.textContent='Falar com a equipe agora';
  chat.appendChild(a);chat.scrollTop=99999;
  try{fetch(APPS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({timestamp:new Date().toLocaleString('pt-BR'),origem:'Pre-qualificacao'},D))});}catch(e){}
}

function q10(inv){D.investimento=inv;say('Perfeito, '+D.nome+'! 🥳',function(){say('Com o que voce me contou, consigo entender qual e o proximo passo.',function(){say('A Isa, da minha equipe, vai entrar em contato em breve 💌 Se preferir falar agora:',function(){setTimeout(done,300);})});})}
function q9(){say('Qual faixa de investimento faria sentido para voce?',function(){choices(['Ate R$400 por mes','Entre R$500 e R$700 por mes','Acima de R$700 por mes','Ainda estou avaliando'],q10);})}
function q8(tr){D.tratamento=tr;say('Ultima pergunta, prometo!',q9);}
function q7(){say('Voce ja tentou algum tratamento?',function(){choices(['Nunca tratei de forma especifica','Ja tentei mas nao resolveu','Tenho diagnostico mas sem protocolo'],q8);})}
function q6(im){D.impacto=im;q7();}
function q5(){say('De 0 a 10, o quanto isso te incomoda?',function(){choices(['0 a 3 incomoda pouco','4 a 6 incomoda bastante','7 a 9 impacta minha rotina','10 nao consigo mais ignorar'],q6);})}
function q4(t){D.tempo=t;q5();}
function q3(){say('Ha quanto tempo voce convive com isso?',function(){choices(['Menos de 6 meses','De 6 meses a 1 ano','De 1 a 3 anos','Mais de 3 anos'],q4);})}
function q2(s){D.sintoma=s;q3();}
function q1(){say('Me conta, o que te incomoda hoje?',function(){choices(['Inchaço e gases constantes','Intestino irregular','Cansaco que nao passa','Queda de cabelo ou pele reagindo','Peso travado','Varios desses ao mesmo tempo'],q2);})}
function qIdade(i){D.idade=i;q1();}
function qZap(zap){D.whatsapp=zap;say('Quantos anos voce tem?',function(){choices(['Ate 25 anos','26 a 35 anos','36 a 45 anos','46 a 55 anos','Acima de 55 anos'],qIdade);});}
function qNome(nome){D.nome=nome;say('Que bom te conhecer, '+nome+'! 😊',function(){say('Qual e o seu WhatsApp com DDD?',function(){ask('(00) 00000-0000',qZap);});});}
function qInicio(v){
  if(v==='Estou com pressa, pode ir direto'){
    say('Sem problema! Me passa seu WhatsApp com DDD',function(){ask('(00) 00000-0000',function(zap){D.whatsapp=zap;say('Anotado! A Isa vai entrar em contato em breve',function(){setTimeout(done,400);});});});
    return;
  }
  say('Qual e o seu primeiro nome?',function(){ask('Seu nome...',qNome);});
}

function start(){
  say('Oi! Seja muito bem-vinda por aqui! 🌿',function(){
    say('Sou a Jaqueline Ferreira, nutricionista especialista em saude intestinal. 🌿',function(){
      say('Criei o Metodo VITA 🌱 um protocolo clinico em fases para quem ja tentou de tudo e ainda nao encontrou uma solucao que dure.',function(){
        say('Antes de te direcionar para qualquer lugar, prefiro entender o seu momento. O caminho certo para uma pessoa costuma ser errado para outra 😊',function(){
          say('Posso te fazer algumas perguntas rapidas?',function(){
            choices(['Claro, pode perguntar!','Estou com pressa, pode ir direto'],qInicio);
          });
        });
      });
    });
  });
}
setTimeout(start,600);
</script>
