<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Método VITA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Libre+Baskerville:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#EDE0D4}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:414px;height:100vh;max-height:850px;background:#FAF8F5;display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;background:#fff;border-bottom:.5px solid rgba(107,39,55,.1)}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #6B2737;flex-shrink:0;position:relative}
.av img{width:100%;height:100%;object-fit:cover;object-position:center center}
.dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:#2D6B52;border-radius:50%;border:2px solid #fff}
.hname{font-family:'Libre Baskerville',serif;font-style:italic;font-size:16px;color:#6B2737}
.hmet{font-size:9px;color:#2D6B52;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.hstat{font-size:11px;color:#2D6B52;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px;background:#FAF8F5}
.chat::-webkit-scrollbar{width:0}
.row{display:flex;align-items:flex-end;gap:8px;margin-bottom:2px;animation:up .25s ease}
.row.j{flex-direction:row}
.row.u{flex-direction:row-reverse}
.mav{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid #6B2737}
.mav img{width:100%;height:100%;object-fit:cover;object-position:center center}
.mav.x{background:transparent;border:none}
.bl{max-width:76%;padding:9px 13px 5px;border-radius:16px;word-wrap:break-word}
.bl.j{background:#fff;border-bottom-left-radius:3px;border:.5px solid rgba(107,39,55,.08);box-shadow:0 1px 3px rgba(107,39,55,.06)}
.bl.u{background:#6B2737;border-bottom-right-radius:3px}
.bl p{font-size:14px;line-height:1.6;color:#1a1a18}
.bl.u p{color:#FAF8F5}
.bl .t{font-size:10px;opacity:.4;text-align:right;margin-top:3px}
.bl.u .t{color:#FAF8F5}
.typ{display:none;align-items:flex-end;gap:8px;padding:2px 14px}
.typ.on{display:flex}
.tav{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid #6B2737}
.tav img{width:100%;height:100%;object-fit:cover;object-position:center center}
.tbl{background:#fff;border:.5px solid rgba(107,39,55,.08);border-radius:16px;border-bottom-left-radius:3px;padding:11px 15px;box-shadow:0 1px 3px rgba(107,39,55,.06)}
.dots{display:flex;gap:4px}
.dots span{width:7px;height:7px;background:#D6B88B;border-radius:50%;animation:blink 1.3s infinite}
.dots span:nth-child(2){animation-delay:.25s}
.dots span:nth-child(3){animation-delay:.5s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px;padding-left:38px}
.opt{background:#fff;border:.5px solid rgba(107,39,55,.25);border-radius:20px;padding:9px 18px;font-size:13.5px;color:#6B2737;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:left;width:fit-content}
.opt:hover{background:#6B2737;color:#FAF8F5;border-color:#6B2737}
.opt:active{transform:scale(.97)}
.btnfin{display:inline-flex;align-items:center;gap:8px;background:#2D6B52;color:#fff;border:none;border-radius:20px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;margin:10px 0 4px 38px}
.btnfin:hover{background:#3A8A6A}
.inp-area{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-top:.5px solid rgba(107,39,55,.08)}
.inp{flex:1;background:#F0EBE3;border:.5px solid rgba(107,39,55,.15);border-radius:22px;padding:10px 16px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;color:#1a1a18}
.inp:disabled{opacity:.4}
.inp::placeholder{color:#9A8878}
.snd{width:42px;height:42px;background:#6B2737;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.snd:hover{background:#8A3348}
.snd svg{width:17px;height:17px;fill:#fff}
</style>
</head>
<body>
<div class="phone">
<div class="hdr">
  <div class="av">
    <img id="avimg" src="" alt="J">
    <div class="dot"></div>
  </div>
  <div>
    <p class="hname">Jaqueline Ferreira</p>
    <p class="hmet">Método VITA</p>
    <p class="hstat" id="stat">digitando...</p>
  </div>
</div>
<div class="chat" id="chat"></div>
<div class="typ" id="typ">
  <div class="tav"><img id="typimg" src="" alt="J"></div>
  <div class="tbl"><div class="dots"><span></span><span></span><span></span></div></div>
</div>
<div class="inp-area">
  <input class="inp" id="inp" type="text" placeholder="Mensagem..." autocomplete="off" disabled>
  <button class="snd" onclick="send()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>
</div>

function tm(){
  var n=new Date();
  return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
}

function addBubble(txt,side){
  var row=document.createElement('div');row.className='row '+side;
  if(side==='j'){
    var a=document.createElement('div');a.className='mav';
    var i=document.createElement('img');i.src=FOTO;i.alt='J';
    a.appendChild(i);row.appendChild(a);
  }
  var b=document.createElement('div');b.className='bl '+side;
  b.innerHTML='<p>'+txt+'</p><div class="t">'+tm()+'</div>';
  row.appendChild(b);
  if(side==='u'){var e=document.createElement('div');e.className='mav x';row.appendChild(e);}
  chat.appendChild(row);
  chat.scrollTop=99999;
}

function addOpts(list,cb){
  var wrap=document.createElement('div');wrap.className='opts';
  list.forEach(function(o){
    var btn=document.createElement('button');btn.className='opt';btn.textContent=o;
    btn.onclick=function(){wrap.remove();addBubble(o,'u');cb(o);};
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);chat.scrollTop=99999;
}

function showTyping(ms,cb){
  typ.classList.add('on');stat.textContent='digitando...';chat.scrollTop=99999;
  setTimeout(function(){typ.classList.remove('on');stat.textContent='online';cb();},ms);
}

function jq(txt,cb){
  var d=Math.min(1200+txt.length*18,3500);
  showTyping(d,function(){addBubble(txt,'j');setTimeout(cb,200);});
}

function enableInp(ph,cb){
  inp.placeholder=ph||'Digite...';inp.disabled=false;inp.focus();inp._cb=cb;
}
function disableInp(){inp.disabled=true;inp.placeholder='Mensagem...';inp._cb=null;}

function send(){
  var v=inp.value.trim();if(!v||inp.disabled)return;
  var cb=inp._cb;inp.value='';disableInp();addBubble(v,'u');if(cb)cb(v);
}
inp.addEventListener('keypress',function(e){if(e.key==='Enter')send();});
